<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Live Cricket Broadcast Overlay</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{width:100%;height:100%;background:transparent;font-family:'Arial Black',Arial,sans-serif;overflow:hidden}
body.bg-green{background:#00b140}
body.bg-dark{background:#0b0f19}
body.ctrl{background:#0b0f19;overflow-y:auto;padding-bottom:140px}

.overlay{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:98%;max-width:1100px;z-index:100;filter:drop-shadow(0 6px 14px rgba(0,0,0,.8))}
.top-bar{height:4px;background:linear-gradient(90deg,#b30000,#ff1e1e,#b30000);border-radius:6px 6px 0 0}
.main{display:flex;height:72px;background:#0d1117;border-left:3px solid #d40000;border-right:3px solid #d40000}

.wing-l{flex:1;display:flex;align-items:center;justify-content:space-between;padding:5px 12px 5px 15px;background:linear-gradient(135deg,#d4a000,#090d16 140%);border-radius:0 36px 36px 0;z-index:2;box-shadow:4px 0 10px rgba(0,0,0,.6)}
.wing-r{flex:1;display:flex;align-items:center;justify-content:space-between;padding:5px 15px 5px 12px;background:linear-gradient(135deg,#046a38,#090d16 140%);border-radius:36px 0 0 36px;z-index:2;box-shadow:-4px 0 10px rgba(0,0,0,.6)}

.pill{background:rgba(0,0,0,.45);color:#fff;font-size:10px;font-weight:800;padding:2px 10px;border-radius:10px;margin-bottom:2px;width:fit-content;text-transform:uppercase}
.score{color:#fff;font-size:28px;font-weight:900;line-height:1;text-shadow:2px 2px 4px rgba(0,0,0,.8)}
.overs{color:#f3f4f6;font-size:14px;font-weight:800;margin-left:6px}
.bowl-lbl{color:#fff;font-size:22px;font-weight:900;text-shadow:2px 2px 4px rgba(0,0,0,.8);text-transform:uppercase}

.flag{width:54px;height:54px;border-radius:50%;background:#111827;border:3px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:900;overflow:hidden;flex-shrink:0}
.flag img{width:100%;height:100%;object-fit:cover}

.center-box{width:100px;background:radial-gradient(#1f2937,#05070a);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.ball{color:#fff;font-size:34px;font-weight:900}
.ball.c4{color:#38bdf8}.ball.c6{color:#facc15}.ball.cW{color:#ef4444}
.dot-l,.dot-r{position:absolute;top:5px;width:8px;height:8px;border-radius:50%;background:#ef4444}
.dot-l{left:8px}.dot-r{right:8px}
.dot-l.on{background:#22c55e;box-shadow:0 0 8px #22c55e}
.dot-r.on{background:#38bdf8;box-shadow:0 0 8px #38bdf8}

.bot-bar{display:flex;height:25px;background:linear-gradient(90deg,#4b2508,#7c3f11,#4b2508);border-top:1.5px solid #f59e0b;border-radius:0 0 6px 6px}
.status{flex:1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;padding:0 8px;white-space:nowrap;overflow:hidden;text-transform:uppercase}
.crr{background:#111827;border-left:2px solid #f59e0b;padding:0 12px;display:flex;align-items:center;color:#fff;font-size:12px;font-weight:900}
.crr span{color:#facc15;margin-left:4px}

.toast{position:fixed;bottom:118px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.95);color:#fff;border:1px solid #38bdf8;padding:6px 14px;border-radius:20px;font-family:sans-serif;font-size:12px;display:none;z-index:99;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Control Panel */
.panel{display:none;max-width:520px;margin:10px auto;background:#111827;color:#fff;border:1px solid #374151;border-radius:12px;padding:14px;font-family:sans-serif}
.panel.open{display:block}
.p-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px solid #1f2937;padding-bottom:8px}
.p-head h3{font-size:15px;color:#facc15}
.badge{font-size:11px;padding:3px 8px;border-radius:10px;background:#7f1d1d;color:#fca5a5}
.badge.ok{background:#065f46;color:#34d399}
.grp{margin-bottom:10px}
.grp label{display:block;font-size:11px;color:#9ca3af;margin-bottom:4px;font-weight:600}
select,input[type=text],input[type=password]{width:100%;background:#1f2937;color:#fff;border:1px solid #374151;border-radius:8px;padding:8px;font-size:13px;user-select:text}
input[type=color]{width:42px;height:34px;border:none;border-radius:6px;background:transparent;cursor:pointer}
.row{display:flex;gap:6px;align-items:center}
.btn{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-g{background:#16a34a}.btn-a{background:#d97706}.btn-r{background:#dc2626}.btn-d{background:#374151}
.pad{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.pad button{background:#1f2937;color:#fff;border:1px solid #4b5563;border-radius:8px;padding:12px 0;font-size:16px;font-weight:900;cursor:pointer}
.pad button:active{background:#38bdf8;color:#000}
.note{font-size:11px;color:#34d399;margin-top:4px}
.url-out{background:#0f172a;border:1px dashed #38bdf8;padding:8px;border-radius:8px;font-size:11px;color:#e2e8f0;word-break:break-all;margin-top:6px;user-select:text}

@media(max-width:600px){
  .main{height:62px}.score{font-size:21px}.overs{font-size:11px}.bowl-lbl{font-size:17px}
  .flag{width:42px;height:42px;font-size:13px}.center-box{width:72px}.ball{font-size:25px}
}
</style>
</head>
<body class="bg-transparent">

<div class="panel" id="panel">
  <div class="p-head">
    <h3>🎛️ Live Cricket & Theme Controller</h3>
    <span class="badge" id="syncBadge">Connecting...</span>
  </div>

  <!-- 1. All Teams + ESPN Auto-Refresh -->
  <div class="grp">
    <label>1. Select Match / IPL / International Teams (Auto-Refresh: 10s)</label>
    <div class="row">
      <select id="matchSel"></select>
      <button class="btn btn-a" onclick="fetchESPN()" title="Refresh ESPN">🔄</button>
      <button class="btn btn-d" onclick="swapTeams()">⇄ Swap</button>
    </div>
    <div class="note" id="espnNote">All 25+ IPL & International Teams Ready</div>
  </div>

  <!-- 2. Custom Team Names + Theme Colors -->
  <div class="grp">
    <label>2. Custom Team Names & Wing Colors</label>
    <div class="row">
      <input type="text" id="custBat" placeholder="Batting Team" oninput="liveTypeTeams()">
      <input type="color" id="col1" value="#d4a000" onchange="liveTypeTeams()">
      <input type="text" id="custBowl" placeholder="Bowling Team" oninput="liveTypeTeams()">
      <input type="color" id="col2" value="#046a38" onchange="liveTypeTeams()">
    </div>
  </div>

  <!-- 3. Ball Control Pad -->
  <div class="grp">
    <label>3. Live Ball Pad</label>
    <div class="pad">
      <button onclick="addBall('0')">0</button>
      <button onclick="addBall('1')">1</button>
      <button onclick="addBall('2')">2</button>
      <button onclick="addBall('3')">3</button>
      <button onclick="addBall('4')" style="color:#38bdf8">4</button>
      <button onclick="addBall('6')" style="color:#facc15">6</button>
      <button onclick="addBall('W')" style="background:#991b1b">W</button>
    </div>
    <div class="row" style="margin-top:6px">
      <button class="btn btn-d" style="flex:1" onclick="addExtra('WD')">+1 WD</button>
      <button class="btn btn-d" style="flex:1" onclick="addExtra('NB')">+1 NB</button>
      <button class="btn btn-r" onclick="resetScoreZero()">0-0</button>
      <button class="btn btn-r" onclick="undoBall()">↩ Undo</button>
    </div>
  </div>

  <!-- 4. Bottom Status Text -->
  <div class="grp">
    <label>4. Bottom Status / Target Text</label>
    <input type="text" id="tickerInp" placeholder="e.g. CSK NEED 24 RUNS IN 12 BALLS" oninput="liveTypeTicker()">
  </div>

  <!-- 5. Direct PRISM Link -->
  <div class="grp">
    <label>5. Copy Direct PRISM Link</label>
    <button class="btn btn-g" style="width:100%" onclick="copyPrismUrl()">📋 Copy Direct PRISM Link</button>
    <div class="url-out" id="prismUrlBox"></div>
  </div>

  <!-- 6. YouTube API & AI Voice -->
  <div class="grp">
    <label>6. YouTube API Key & Live Video ID</label>
    <input type="password" id="apiKeyInp" placeholder="Paste YouTube API Key (AIzaSy...)" style="margin-bottom:5px">
    <div class="row">
      <input type="text" id="vidInp" placeholder="YouTube Live Video URL or ID">
      <button class="btn btn-g" onclick="connectYT()">Connect</button>
    </div>
    <div class="note" id="ytNote">Demo Mode Ready</div>
  </div>

  <div class="grp row" style="justify-content:space-between;background:#1f2937;padding:8px 10px;border-radius:8px">
    <span style="font-size:13px;font-weight:700">🎙️ AI Voice Reader (Turns Blue Light ON)</span>
    <input type="checkbox" id="aiChk" style="width:20px;height:20px" onchange="toggleAI(this.checked)">
  </div>

  <div class="grp row">
    <button class="btn btn-g" style="flex:1" onclick="testAI()">🔊 Test Voice</button>
    <button class="btn btn-d" onclick="nextDemo()">▶ Next</button>
    <button class="btn" onclick="hidePanel()">Hide</button>
  </div>

  <div class="grp row" style="margin-bottom:0">
    <button class="btn btn-d" style="flex:1" onclick="setBg('bg-transparent')">Transparent</button>
    <button class="btn btn-g" style="flex:1" onclick="setBg('bg-green')">Green Screen</button>
    <button class="btn btn-d" style="flex:1" onclick="setBg('bg-dark')">Dark</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay">
  <div class="top-bar"></div>
  <div class="main">
    <div class="wing-l" id="wL">
      <div>
        <div class="pill" id="batName">SRI LANKA</div>
        <div style="display:flex;align-items:baseline">
          <span class="score" id="batScore">66-5</span>
          <span class="overs" id="batOv">22.2</span>
        </div>
      </div>
      <div class="flag" id="batFlag"><img src="https://flagcdn.com/w160/lk.png"></div>
    </div>

    <div class="center-box" onclick="openPanel()">
      <div class="dot-l" id="dotSync" title="Green = Live Sync Connected"></div>
      <div class="dot-r" id="dotAI" title="Blue = AI Voice Active"></div>
      <div class="ball" id="lastBall">2</div>
    </div>

    <div class="wing-r" id="wR">
      <div class="flag" id="bowlFlag"><img src="https://flagcdn.com/w160/pk.png"></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end">
        <div class="pill" id="bowlName">PAKISTAN</div>
        <div class="bowl-lbl" id="bowlStat">BOWLING</div>
      </div>
    </div>
  </div>
  <div class="bot-bar">
    <div class="status" id="botTxt">PAK OPT TO BOWL</div>
    <div class="crr">CRR:<span id="crrTxt">2.96</span></div>
  </div>
</div>

<script>
const BUILTIN_TEAMS=[
  {id:'sl-pak',lbl:'SRI LANKA vs PAKISTAN - ODI [LIVE]',bN:'SRI LANKA',bC:'lk',c1:'#d4a000',r:66,w:5,b:134,lb:'2',fN:'PAKISTAN',fC:'pk',c2:'#046a38',fS:'BOWLING',t:'PAK OPT TO BOWL'},
  {id:'ind-aus',lbl:'INDIA vs AUSTRALIA - T20I [LIVE]',bN:'INDIA',bC:'in',c1:'#0057b8',r:184,w:3,b:104,lb:'6',fN:'AUSTRALIA',fC:'au',c2:'#eab308',fS:'BOWLING',t:'AUS OPT TO BOWL'},
  {id:'ind-pak',lbl:'INDIA vs PAKISTAN - CUP [SCHEDULED]',bN:'INDIA',bC:'in',c1:'#0057b8',r:0,w:0,b:0,lb:'VS',fN:'PAKISTAN',fC:'pk',c2:'#046a38',fS:'SCHEDULED',t:'MATCH STARTS AT 7:30 PM IST'},
  {id:'csk-mi',lbl:'CHENNAI (CSK) vs MUMBAI (MI) - IPL [LIVE]',bN:'CHENNAI',bC:'CSK',c1:'#eab308',r:142,w:4,b:90,lb:'4',fN:'MUMBAI',fC:'MI',c2:'#1d4ed8',fS:'BOWLING',t:'MUMBAI OPT TO BOWL'},
  {id:'rcb-kkr',lbl:'BENGALURU (RCB) vs KOLKATA (KKR) - IPL [SCHEDULED]',bN:'BENGALURU',bC:'RCB',c1:'#dc2626',r:0,w:0,b:0,lb:'VS',fN:'KOLKATA',fC:'KKR',c2:'#581c87',fS:'SCHEDULED',t:'TOSS AT 7:00 PM IST'},
  {id:'srh-rr',lbl:'HYDERABAD (SRH) vs RAJASTHAN (RR) - IPL [SCHEDULED]',bN:'HYDERABAD',bC:'SRH',c1:'#ea580c',r:0,w:0,b:0,lb:'VS',fN:'RAJASTHAN',fC:'RR',c2:'#db2777',fS:'SCHEDULED',t:'IPL SCHEDULED MATCH'},
  {id:'gt-lsg',lbl:'GUJARAT (GT) vs LUCKNOW (LSG) - IPL [SCHEDULED]',bN:'GUJARAT',bC:'GT',c1:'#1e293b',r:0,w:0,b:0,lb:'VS',fN:'LUCKNOW',fC:'LSG',c2:'#0284c7',fS:'SCHEDULED',t:'IPL SCHEDULED MATCH'},
  {id:'dc-pbks',lbl:'DELHI (DC) vs PUNJAB (PBKS) - IPL [SCHEDULED]',bN:'DELHI',bC:'DC',c1:'#2563eb',r:0,w:0,b:0,lb:'VS',fN:'PUNJAB',fC:'PBKS',c2:'#dc2626',fS:'SCHEDULED',t:'IPL SCHEDULED MATCH'},
  {id:'eng-sa',lbl:'ENGLAND vs SOUTH AFRICA - ODI [LIVE]',bN:'ENGLAND',bC:'gb-eng',c1:'#1e40af',r:215,w:6,b:210,lb:'1',fN:'SOUTH AFRICA',fC:'za',c2:'#15803d',fS:'BOWLING',t:'ENG OPT TO BAT'},
  {id:'nz-ban',lbl:'NEW ZEALAND vs BANGLADESH [SCHEDULED]',bN:'NEW ZEALAND',bC:'nz',c1:'#1f2937',r:0,w:0,b:0,lb:'VS',fN:'BANGLADESH',fC:'bd',c2:'#065f46',fS:'SCHEDULED',t:'SCHEDULED MATCH'},
  {id:'wi-afg',lbl:'WEST INDIES vs AFGHANISTAN [SCHEDULED]',bN:'WEST INDIES',bC:'wi',c1:'#7f1d1d',r:0,w:0,b:0,lb:'VS',fN:'AFGHANISTAN',fC:'af',c2:'#1d4ed8',fS:'SCHEDULED',t:'SCHEDULED MATCH'}
];

let allTeams=[...BUILTIN_TEAMS];
let st={...BUILTIN_TEAMS[0],bg:'bg-transparent',ai:true,ts:0};
let hist=[];
const SENDER_ID='snd_'+Math.random().toString(36).slice(2,9);
const TOPIC='cricket/live/kinggopan_v4_stream';
let client=null;
const qp=new URLSearchParams(location.search);

function buildDropdown(){
  const sel=document.getElementById('matchSel');
  sel.innerHTML='';
  allTeams.forEach(m=>{
    let o=document.createElement('option');
    o.value=m.id;o.textContent=m.lbl;
    if(m.id===st.id)o.selected=true;
    sel.appendChild(o);
  });
}

document.getElementById('matchSel').onchange=e=>{
  let f=allTeams.find(x=>x.id===e.target.value);
  if(f){
    hist.push({...st});
    st={...st,...f,ts:Date.now()};
    document.getElementById('custBat').value=f.bN;
    document.getElementById('custBowl').value=f.fN;
    document.getElementById('col1').value=f.c1;
    document.getElementById('col2').value=f.c2;
    render();sync();
  }
};

function liveTypeTeams(){
  let b=document.getElementById('custBat').value.trim().toUpperCase();
  let f=document.getElementById('custBowl').value.trim().toUpperCase();
  let c1=document.getElementById('col1').value;
  let c2=document.getElementById('col2').value;
  if(b){st.bN=b;st.bC=b.slice(0,3);}
  if(f){st.fN=f;st.fC=f.slice(0,3);}
  st.c1=c1;st.c2=c2;st.ts=Date.now();
  st.t=`${st.bN} VS ${st.fN} - LIVE`;
  render();sync();
}

function resetScoreZero(){
  hist.push({...st});
  st.r=0;st.w=0;st.b=0;st.lb='0';st.fS='BOWLING';st.ts=Date.now();
  render();sync();
}

function liveTypeTicker(){
  let v=document.getElementById('tickerInp').value.trim();
  if(v){st.t=v.toUpperCase();st.ts=Date.now();render();sync();}
}

async function fetchESPN(){
  try{
    let r=await fetch('https://site.api.espn.com/apis/site/v2/sports/cricket/scorepanel?_t='+Date.now());
    let d=await r.json();
    let list=[];
    (d.scores||[]).forEach(lg=>(lg.events||[]).forEach(ev=>{
      let state=ev.status?.type?.state;
      let tag=state==='in'?'LIVE':state==='post'?'RESULT':'SCHEDULED';
      let cs=ev.competitions?.[0]?.competitors||[];
      if(cs.length>=2){
        let n1=(cs[0].team?.shortDisplayName||'TEAM 1').toUpperCase();
        let n2=(cs[1].team?.shortDisplayName||'TEAM 2').toUpperCase();
        let sc=String(cs[0].score||'0/0').split('/');
        list.push({
          id:'espn-'+ev.id,lbl:`${n1} vs ${n2} [${tag}]`,
          bN:n1,bC:(cs[0].team?.abbreviation||n1.slice(0,3)).toUpperCase(),c1:'#1d4ed8',
          r:parseInt(sc[0])||0,w:parseInt(sc[1])||0,b:tag==='LIVE'?60:0,lb:tag==='LIVE'?'•':'VS',
          fN:n2,fC:(cs[1].team?.abbreviation||n2.slice(0,3)).toUpperCase(),c2:'#047857',
          fS:tag==='LIVE'?'BOWLING':tag,t:(ev.status?.type?.detail||tag).toUpperCase()
        });
      }
    }));
    if(list.length){
      allTeams=[...list,...BUILTIN_TEAMS];
      buildDropdown();
      let activeEspn=list.find(x=>x.id===st.id);
      if(activeEspn){st={...st,...activeEspn};render();}
      document.getElementById('espnNote').textContent=`Auto-Refreshed: ${list.length} ESPN + All Teams`;
    }
  }catch(e){}
}

function updatePrismUrlBox(){
  let base=location.origin+location.pathname;
  let p=new URLSearchParams();
  p.set('bat',st.bN);
  p.set('bowl',st.fN);
  p.set('c1',st.c1.replace('#',''));
  p.set('c2',st.c2.replace('#',''));
  let full=`${base}?${p.toString()}`;
  document.getElementById('prismUrlBox').textContent=full;
  return full;
}

function copyPrismUrl(){
  let u=updatePrismUrlBox();
  if(navigator.clipboard)navigator.clipboard.writeText(u);
  alert('Copied PRISM Link:\n\n'+u);
}

function makeGrad(hex){
  return `linear-gradient(135deg, ${hex} 0%, #090d16 140%)`;
}

function render(){
  document.getElementById('batName').textContent=st.bN;
  document.getElementById('wL').style.background=makeGrad(st.c1||'#d4a000');
  document.getElementById('batScore').textContent=`${st.r}-${st.w}`;
  document.getElementById('batOv').textContent=Math.floor(st.b/6)+'.'+(st.b%6);
  let lb=document.getElementById('lastBall');
  lb.textContent=st.lb;lb.className='ball'+(st.lb==='4'?' c4':st.lb==='6'?' c6':st.lb==='W'?' cW':'');
  document.getElementById('bowlName').textContent=st.fN;
  document.getElementById('wR').style.background=makeGrad(st.c2||'#046a38');
  document.getElementById('bowlStat').textContent=st.fS;
  document.getElementById('botTxt').textContent=st.t;
  document.getElementById('crrTxt').textContent=st.b>0?((st.r/st.b)*6).toFixed(2):'0.00';
  setFlag('batFlag',st.bC,st.bN);setFlag('bowlFlag',st.fC,st.fN);
  if(!document.body.classList.contains('ctrl'))document.body.className=st.bg;
  document.getElementById('aiChk').checked=st.ai;
  document.getElementById('dotAI').className='dot-r'+(st.ai?' on':'');
  updatePrismUrlBox();
}

function setFlag(id,c,n){
  let el=document.getElementById(id);
  let cl=(c||'').toLowerCase();
  if(cl.length===2||cl==='gb-eng')el.innerHTML=`<img src="https://flagcdn.com/w160/${cl}.png" onerror="this.style.display='none';this.parentNode.textContent='${n.slice(0,3)}'">`;
  else el.textContent=(c||n).slice(0,4).toUpperCase();
}

function sync(){
  st.ts=Date.now();
  localStorage.setItem('ck_st_v4',JSON.stringify(st));
  if(client&&client.connected){
    client.publish(TOPIC,JSON.stringify({k:'ST',sid:SENDER_ID,d:st}),{retain:true});
  }
}

function addBall(v){hist.push({...st});st.lb=v;if(v==='W'){if(st.w<10)st.w++;st.b++;}else{st.r+=parseInt(v);st.b++;}render();sync();}
function addExtra(v){hist.push({...st});st.r++;st.lb=v;render();sync();}
function undoBall(){if(hist.length){st=hist.pop();render();sync();}}
function setBg(b){st.bg=b;render();sync();}
function swapTeams(){
  hist.push({...st});
  [st.bN,st.fN]=[st.fN,st.bN];[st.bC,st.fC]=[st.fC,st.bC];[st.c1,st.c2]=[st.c2,st.c1];
  st.r=0;st.w=0;st.b=0;st.lb='0';st.fS='BOWLING';st.t=`${st.bN} CHASING`;render();sync();
}

function openPanel(){document.body.classList.add('ctrl');document.getElementById('panel').classList.add('open');}
function hidePanel(){document.body.classList.remove('ctrl');document.body.className=st.bg;document.getElementById('panel').classList.remove('open');}

// AI Speech
const DEMOS=[{a:'Arjun',m:'What a fantastic boundary!'},{a:'Rahul',m:'Great bowling spell right now.'},{a:'Vishnu',m:'Awesome live stream bro!'}];
let dIdx=0,q=[],speaking=false;
function speak(a,m){
  let txt=`${a} says: ${m}`;
  let t=document.getElementById('toast');t.textContent=`🎙️ ${a}: ${m}`;t.style.display='block';
  clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',4500);
  q.push(txt);runQ();
}
function runQ(){
  if(speaking||!q.length)return;speaking=true;let txt=q.shift();
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    let u=new SpeechSynthesisUtterance(txt);u.lang='en-IN';
    u.onend=u.onerror=()=>{speaking=false;runQ();};
    window.speechSynthesis.speak(u);
  }else{speaking=false;}
}
let dTimer=null;
function toggleAI(on){
  st.ai=on;render();sync();clearInterval(dTimer);
  if(on){nextDemo();dTimer=setInterval(()=>{if(!ytChat)nextDemo();},12000);}
}
function nextDemo(){
  let x=DEMOS[dIdx++%DEMOS.length];speak(x.a,x.m);
  if(client&&client.connected)client.publish(TOPIC,JSON.stringify({k:'SP',sid:SENDER_ID,a:x.a,m:x.m}));
}
function testAI(){
  speak('Gopakumar','Both lights are ON and live sync is working!');
  if(client&&client.connected)client.publish(TOPIC,JSON.stringify({k:'SP',sid:SENDER_ID,a:'Gopakumar',m:'Both lights are ON and live sync is working!'}));
}

// YouTube Chat
let ytChat=null,ytTok=null,ytInt=null,seen=new Set();
async function connectYT(){
  let k=document.getElementById('apiKeyInp').value.trim();
  let v=document.getElementById('vidInp').value.trim();
  let m=v.match(/(?:v=|\/live\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);if(m)v=m[1];
  if(!k||!v)return;
  document.getElementById('ytNote').textContent='Connecting...';
  try{
    let r=await fetch(`https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=${v}&key=${k}`);
    let d=await r.json();ytChat=d.items?.[0]?.liveStreamingDetails?.activeLiveChatId;
    if(!ytChat){document.getElementById('ytNote').textContent='Live chat not found';return;}
    document.getElementById('ytNote').textContent='Connected to YouTube Live!';
    st.ai=true;render();sync();clearInterval(ytInt);
    ytInt=setInterval(async()=>{
      if(!ytChat||!st.ai)return;
      let u=`https://www.googleapis.com/youtube/v3/liveChat/messages?liveChatId=${ytChat}&part=snippet,authorDetails&key=${k}`+(ytTok?`&pageToken=${ytTok}`:'');
      let res=await fetch(u);let dat=await res.json();if(dat.nextPageToken)ytTok=dat.nextPageToken;
      (dat.items||[]).forEach(i=>{if(!seen.has(i.id)){seen.add(i.id);let a=i.authorDetails?.displayName||'Viewer',tx=i.snippet?.displayMessage||'';if(tx){speak(a,tx);if(client&&client.connected)client.publish(TOPIC,JSON.stringify({k:'SP',sid:SENDER_ID,a,m:tx}));}}});
    },6000);
  }catch(e){document.getElementById('ytNote').textContent='Connection Error';}
}

buildDropdown();
try{let s=JSON.parse(localStorage.getItem('ck_st_v4'));if(s)st={...st,...s};}catch(e){}

if(qp.get('bat')){st.bN=qp.get('bat').toUpperCase();st.bC=st.bN.slice(0,3);}
if(qp.get('bowl')){st.fN=qp.get('bowl').toUpperCase();st.fC=st.fN.slice(0,3);}
if(qp.get('c1'))st.c1='#'+qp.get('c1').replace('#','');
if(qp.get('c2'))st.c2='#'+qp.get('c2').replace('#','');
if(qp.get('control')==='1')openPanel();

render();
fetchESPN();
setInterval(fetchESPN,10000);

if(typeof mqtt!=='undefined'){
  client=mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
  client.on('connect',()=>{
    document.getElementById('dotSync').classList.add('on');
    let b=document.getElementById('syncBadge');b.textContent='● Live Synced';b.classList.add('ok');
    client.subscribe(TOPIC);
    if(qp.get('control')==='1')sync();
  });
  client.on('message',(t,msg)=>{
    try{
      let p=JSON.parse(msg.toString());
      if(p.sid===SENDER_ID)return;
      if(p.k==='ST'&&p.d){
        st={...st,...p.d};
        render();
      }else if(p.k==='SP'){speak(p.a,p.m);}
    }catch(e){}
  });
}
